services:
  - type: web
    name: quiz-server
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: CALL_STRATEGY
        value: smart
      - key: MAX_TOKENS
        value: 1500